services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gargantua
      POSTGRES_USER: gargantua
      POSTGRES_PASSWORD: gargantua
    ports:
      - "5432:5432"
    volumes:
      - gargantua-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gargantua -d gargantua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gargantua-postgres:
